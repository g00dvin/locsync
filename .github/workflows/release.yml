name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Determine version
      id: version
      env:
        VERSION: ${{ inputs.tag || github.ref_name }}
      run: |
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "version=${VERSION}"

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4

    - name: Decode Keystore
      run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

    - name: Build release APKs
      env:
        VERSION_NAME: ${{ steps.version.outputs.version }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        ./gradlew assembleRelease

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: Release ${{ steps.version.outputs.version }}
        draft: false
        prerelease: false
        files: |
          client-app/build/outputs/apk/release/locsync-client-${{ steps.version.outputs.version }}.apk
          server-app/build/outputs/apk/release/locsync-server-${{ steps.version.outputs.version }}.apk
